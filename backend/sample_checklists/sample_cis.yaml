benchmark_name: "CIS Amazon Web Services Foundations Benchmark"
version: "3.0"
sections:
  - id: "1.1"
    title: "Avoid the use of root account"
    description: "The root account has unrestricted access to all resources in the AWS account. Avoiding the use of root account and instead using IAM users reduces risk of compromise."
    severity: "high"
    section: "Identity and Access Management"
    scored: true
  - id: "1.2"
    title: "Ensure MFA is enabled for all IAM users with console access"
    description: "Multi-Factor Authentication adds an extra layer of protection. All users with console access should have MFA enabled to reduce the risk of unauthorized access."
    severity: "high"
    section: "Identity and Access Management"
  - id: "1.3"
    title: "Ensure credentials unused for 90 days or greater are disabled"
    description: "Disabling or removing credentials that have been unused for 90 days or more reduces the risk of stale credentials being used for unauthorized access."
    severity: "medium"
    section: "Identity and Access Management"
  - id: "1.4"
    title: "Ensure access keys are rotated every 90 days or less"
    description: "Access keys should be rotated to reduce the window of opportunity for compromised keys to be used."
    severity: "medium"
    section: "Identity and Access Management"
  - id: "2.1"
    title: "Ensure CloudTrail is enabled in all regions"
    description: "AWS CloudTrail records AWS API calls. Enabling it in all regions ensures coverage of all activity in the AWS account."
    severity: "high"
    section: "Logging"
  - id: "2.2"
    title: "Ensure CloudTrail log file validation is enabled"
    description: "Enabling log file validation provides additional integrity checking of log files. This ensures the logs have not been tampered with after delivery."
    severity: "medium"
    section: "Logging"
  - id: "2.3"
    title: "Ensure S3 bucket access logging is enabled on the CloudTrail S3 bucket"
    description: "S3 bucket access logging generates records for all requests made to the S3 bucket. These records are useful for security audits."
    severity: "medium"
    section: "Logging"
  - id: "3.1"
    title: "Ensure VPC flow logging is enabled in all VPCs"
    description: "VPC Flow Logs captures information about the IP traffic going to and from network interfaces in your VPC. This enables network monitoring and forensics."
    severity: "high"
    section: "Networking"
  - id: "3.2"
    title: "Ensure no security groups allow ingress from 0.0.0.0/0 to port 22"
    description: "Unrestricted SSH access increases the attack surface and risk of brute force and unauthorized access attempts."
    severity: "high"
    section: "Networking"
  - id: "3.3"
    title: "Ensure default security group restricts all traffic"
    description: "The default security group in every VPC should be configured to restrict all inbound and outbound traffic."
    severity: "medium"
    section: "Networking"
  - id: "4.1"
    title: "Ensure S3 bucket encryption is enabled"
    description: "Amazon S3 server-side encryption protects data at rest. All S3 buckets should have default encryption enabled."
    severity: "high"
    section: "Data Protection"
  - id: "4.2"
    title: "Ensure EBS volume encryption is enabled"
    description: "EBS volume encryption provides an additional layer of data protection by encrypting data at rest stored on EBS volumes."
    severity: "medium"
    section: "Data Protection"
