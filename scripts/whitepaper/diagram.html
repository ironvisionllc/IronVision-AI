<text x="1050" y="386" font-size="14" fill="#6B4A10">• Anthropic (direct)</text>

<text x="56" y="454" font-size="13" fill="#4B6470">• heartbeat</text>

<rect x="330" y="580" width="300" height="150" rx="16" fill="#fff" stroke="#2597B2" stroke-width="2"/>

<text x="680" y="698" font-size="13" fill="#4B6470">AWS S3, DO Spaces, Garage …</text>

<rect x="1030" y="580" width="330" height="150" rx="16" fill="#fff" stroke="#9CC9D5" stroke-width="2" stroke-dasharray="6 5"/>

<text x="1050" y="698" font-size="13" fill="#4B6470">• Prometheus / Grafana, eMASS API</text>
