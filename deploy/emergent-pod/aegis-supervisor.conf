[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /app/data/postgres -c listen_addresses=127.0.0.1 -c port=5432 -c unix_socket_directories=/tmp
user=postgres
autostart=true
autorestart=true
priority=1
stopsignal=INT
stderr_logfile=/var/log/supervisor/postgres.err.log
stdout_logfile=/var/log/supervisor/postgres.out.log

[program:worker]
command=/root/.venv/bin/python -m worker.main
directory=/app/backend
environment=PYTHONPATH="/app/backend"
autostart=true
autorestart=true
startsecs=3
stderr_logfile=/var/log/supervisor/worker.err.log
stdout_logfile=/var/log/supervisor/worker.out.log
stopsignal=TERM
stopasgroup=true
killasgroup=true
