# TLS edge for docker-compose.prod.yml. Place certificate/key at deploy/tls/tls.crt and deploy/tls/tls.key (PLACEHOLDER – not committed).
# For CAC/PIV (AUTH_PROVIDERS=mtls_header) enable ssl_verify_client with your DoD CA bundle and forward the verified identity
# headers below; MTLS_TRUSTED_PROXIES must contain this proxy's address.
server {
    listen 8080;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 60m;

    # ssl_client_certificate /etc/nginx/tls/dod-ca-bundle.pem;
    # ssl_verify_client optional;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/v1/metrics { deny all; }
    location = /metrics { return 404; }

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Always overwrite client-supplied identity headers:
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        proxy_set_header X-Client-EDIPI "";
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
    }
}
