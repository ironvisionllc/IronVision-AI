# Recovery tooling overlay (added by ./recover.sh only – never part of a normal deploy).
#   recovery           one-off tool container: app code + PostgreSQL 16 client tools, same network as postgres/seaweedfs/keycloak
#   rehearsal-backend  backend pointed at the rehearsal DB/bucket; 127.0.0.1:8012 only (SSH tunnel), never behind the edge
x-recovery-env: &recovery-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
  STORAGE_DRIVER: s3
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://seaweedfs:8333}
  S3_BUCKET: ${S3_BUCKET}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  RECOVER_S3_ADMIN_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY_ID:-}
  RECOVER_S3_ADMIN_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_ACCESS_KEY:-}
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ironvision-demo}
  KEYCLOAK_CONFIGURATOR_CLIENT_ID: ${KEYCLOAK_CONFIGURATOR_CLIENT_ID:-ironvision-configurator}
  KEYCLOAK_CONFIGURATOR_CLIENT_SECRET: ${KEYCLOAK_CONFIGURATOR_CLIENT_SECRET:-}
  KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-ironvision-app}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  APP_DOMAIN: ${APP_DOMAIN:-}
  APP_ENV: production

services:
  recovery:
    profiles: ["recovery"]
    build: {context: ., dockerfile: deploy/recovery/Dockerfile}
    image: ironvision/recovery:local
    environment: *recovery-env
    volumes:
      - ${RECOVER_PREDEPLOY_DIR:-/root/ironvision-predeploy}:/predeploy:ro
      - ${RECOVERY_DIR:-/root/ironvision-recovery}:/recovery
    restart: "no"

  rehearsal-backend:
    profiles: ["recovery"]
    # The SAME image definition as the live backend (backend/Dockerfile + requirements.prod.txt, its CMD
    # `uvicorn app.main:app …`, build-time selfcheck --startup), tagged separately so the live backend's image is never
    # replaced. Rebuilt by recover.sh on every run (image_gate). NOT the recovery tool image: that one has no uvicorn.
    build: {context: ./backend, dockerfile: Dockerfile}
    image: ironvision/rehearsal-backend:local
    # Same configuration as the live backend (the production env file: OIDC redirect/issuer, demo launcher, CORS, …) with
    # scratch-only overrides below. recover.sh runs the probes INSIDE this container against 127.0.0.1:8001.
    env_file: ["${RECOVER_ENV_FILE:?RECOVER_ENV_FILE (set by recover.sh)}"]
    environment:
      <<: *recovery-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${REHEARSAL_DB:-rehearsal-db-not-set}
      S3_BUCKET: ${REHEARSAL_BUCKET:-rehearsal-bucket-not-set}
      S3_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_ACCESS_KEY:-}
      AUTH_PROVIDERS: ${AUTH_PROVIDERS:-oidc}
      JWT_SECRET: ${JWT_SECRET}
      SECRET_STORE_KEY: ${SECRET_STORE_KEY:-}
      WORKER_ENABLED: "false"
      SEED_DEMO_DATA: "false"
      RECOVERY_DIR: /recovery
      # SSO → the isolated scratch Keycloak only (values exported by recover.sh from the 0600 scratch files; never in the env file).
      # The production configurator/admin secrets from env_file are blanked: the rehearsal backend has no production Keycloak access.
      KEYCLOAK_URL: http://rehearsal-keycloak:8080
      OIDC_ISSUER: ${SCRATCH_OIDC_ISSUER:-http://rehearsal-keycloak:8080/realms/ironvision-demo}
      OIDC_CLIENT_ID: ironvision-app
      OIDC_CLIENT_SECRET: ${SCRATCH_OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: http://127.0.0.1:8001/api/v1/auth/oidc/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: http://127.0.0.1:8001/login
      FRONTEND_URL: http://127.0.0.1:8001
      CORS_ORIGINS: http://127.0.0.1:8001
      DEPLOYMENT_KIND: demo
      ALLOW_DEMO_LOGIN: "true"
      KEYCLOAK_DEMO_LAUNCHER_CLIENT_ID: ironvision-demo-launcher
      KEYCLOAK_DEMO_LAUNCHER_CLIENT_SECRET: ${SCRATCH_DEMO_LAUNCHER_CLIENT_SECRET:-}
      KEYCLOAK_DEMO_USERNAME: ${SCRATCH_DEMO_USERNAME:-}
      KEYCLOAK_DEMO_PASSWORD: ${SCRATCH_DEMO_PASSWORD:-}
      KEYCLOAK_BACKEND_CLIENT_ID: ironvision-backend
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${SCRATCH_BACKEND_CLIENT_SECRET:-}
      KEYCLOAK_CONFIGURATOR_CLIENT_SECRET: ""
      KEYCLOAK_ADMIN_PASSWORD: ""
      REHEARSAL_FORBIDDEN_HOSTS: ${REHEARSAL_FORBIDDEN_HOSTS:-}
    depends_on: {}
    volumes:
      - ${RECOVERY_DIR:-/root/ironvision-recovery}:/recovery
      - ./scripts/e2e_sso.py:/srv/scripts/e2e_sso.py:ro   # rehearse-probe (exec -u 0) runs it inside this container
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/api/v1/health/live', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 40
      start_period: 10s
    ports: ["127.0.0.1:8012:8001"]
    restart: "no"

  # Isolated, throw-away Keycloak for the rehearsal SSO e2e: own scratch DB + role (rec_kc_<ts>, created by scratch_sso
  # prepare), NO published ports, not behind the edge, removed by recover.sh after every rehearsal. Same image as production.
  # KC_HOSTNAME = the internal URL used by BOTH the rehearsal backend and the e2e (which runs inside it) → issuer validation
  # genuinely passes (nothing disabled).
  rehearsal-keycloak:
    profiles: ["recovery"]
    image: ${REHEARSAL_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.1}
    command: ["start-dev", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://postgres:5432/rec-kc-not-set}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-rec-kc-not-set}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
      KC_HOSTNAME: http://rehearsal-keycloak:8080
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: "no"
