name: aegisrmf

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  ALLOW_INSECURE_PRODUCTION: ${ALLOW_INSECURE_PRODUCTION:-false}
  STAGING_DEMO_PASSWORD: ${STAGING_DEMO_PASSWORD:-}
  DEV_USER_PICKER: ${DEV_USER_PICKER:-true}
  DOCS_ROOT: /srv/handover
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  JWT_SECRET: ${JWT_SECRET}
  JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
  AUTH_PROVIDER: dev_password
  AUTH_PROVIDERS: ${AUTH_PROVIDERS:-dev_password}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
  SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-20/60}
  RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-30/60}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
  UPLOAD_SCANNER: ${UPLOAD_SCANNER:-none}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
  MTLS_TRUSTED_PROXIES: ${MTLS_TRUSTED_PROXIES:-}
  SECRET_STORE_BACKEND: ${SECRET_STORE_BACKEND:-env_key}
  VAULT_ADDR: ${VAULT_ADDR:-}
  VAULT_TOKEN: ${VAULT_TOKEN:-}
  VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
  VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
  DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
  CORS_ORIGINS: ${CORS_ORIGINS}
  # Object storage (env only): s3 + SeaweedFS (default, COMPOSE_PROFILES=seaweedfs) | s3 + external (DO Spaces / AWS S3 / Garage) | local
  STORAGE_DRIVER: ${STORAGE_DRIVER:?STORAGE_DRIVER must be set in your env file - s3 or local - deploy with scripts/deploy.sh ENV_FILE}
  STORAGE_LOCAL_ROOT: /srv/objects
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://seaweedfs:8333}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  AI_PROVIDER: ${AI_PROVIDER:-none}
  AI_MODEL: ${AI_MODEL}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL}
  OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY}
  AI_MODEL_DRAFTING: ${AI_MODEL_DRAFTING:-}
  AI_MODEL_POLICY: ${AI_MODEL_POLICY:-}
  AI_MODEL_MAPPING: ${AI_MODEL_MAPPING:-}
  AI_MODEL_SUMMARY: ${AI_MODEL_SUMMARY:-}
  AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
  OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
  OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-}
  CONTENT_DIR: /srv/backend/content
  CONTENT_FETCH_REMOTE: "false"
  SECRET_STORE_KEY: ${SECRET_STORE_KEY}
  SAMPLES_DIR: /samples

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Self-hosted S3 (replaces MinIO, whose community images are no longer published). Internal network only – no host ports.
  seaweedfs:
    profiles: ["seaweedfs"]
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.48}
    entrypoint: ["/bin/sh", "/etc/ironvision/seaweedfs-entrypoint.sh"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ADMIN_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-}}
      S3_ADMIN_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-}}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SEAWEEDFS_VOLUME_SIZE_LIMIT_MB: ${SEAWEEDFS_VOLUME_SIZE_LIMIT_MB:-1024}
    volumes:
      - objectstore:/data
      - ./deploy/seaweedfs/entrypoint.sh:/etc/ironvision/seaweedfs-entrypoint.sh:ro
    expose: ["8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # One-shot bucket bootstrap with our own backend image (no `mc`): create bucket, versioning, SHA-256 round-trip.
  objectstore-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.tools.s3_bootstrap"]
    environment:
      <<: *backend-env
      S3_ADMIN_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-}}
      S3_ADMIN_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-}}
      S3_BUCKET_VERSIONING: ${S3_BUCKET_VERSIONING:-true}
      S3_BOOTSTRAP_WAIT_SECONDS: ${S3_BOOTSTRAP_WAIT_SECONDS:-90}
    depends_on:
      seaweedfs:
        condition: service_healthy
        required: false
    restart: "no"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    volumes:
      - ./samples:/samples:ro
      - localobjects:/srv/objects
    environment:
      <<: *backend-env
      SEED_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
      SEED_DEMO_DATA: "false"
    volumes:
      - ./samples:/samples:ro
      - localobjects:/srv/objects
      - ./README.md:/srv/handover/README.md:ro
      - ./docs:/srv/handover/docs:ro
    ports:
      - "8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      <<: *backend-env
      WORKER_ID: compose-worker-1
      SEED_DEMO_DATA: "true"
    volumes:
      - ./samples:/samples:ro
      - localobjects:/srv/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
        REACT_APP_ENV_LABEL: ${REACT_APP_ENV_LABEL:-}
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped

  # ---- optional profiles: docker compose --profile keycloak|clamav|monitoring up ----
  keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}  # required when the keycloak profile is enabled (check_env)
    volumes:
      - ./deploy/keycloak/aegisrmf-realm.json:/opt/keycloak/data/import/aegisrmf-realm.json:ro
    ports:
      - "8081:8080"

  clamav:
    profiles: ["clamav"]
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      retries: 20

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}  # required when the monitoring profile is enabled (check_env)
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  objectstore:     # SeaweedFS data (profile seaweedfs)
  localobjects:    # STORAGE_DRIVER=local evidence store
